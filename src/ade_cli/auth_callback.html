<html lang="en">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Light-only on purpose: the Logto LandingAI experience force-lights the
     whole auth flow (use-theme.ts "Force light mode for LandingAI app"),
     so the callback matches the sign-in page it follows. color-scheme
     stops browser auto-darkening from inverting it. -->
<meta name="color-scheme" content="light">
<title>ade — sign-in</title>
<!--
  The loopback-callback landing page, styled 1:1 on the LandingAI Logto
  sign-in experience (repo logto, packages/experience):
    layout/copy:  src/pages/SignIn/LandingSignIn.tsx
    geometry:     src/pages/SignIn/LandingSignIn.module.scss (80px logo
                  header pad 0/40, 454px centered column, headline 28/600
                  #1E232C over Instrument Serif italic 32/40, subtitle
                  16/24 #525252, footer 12/16 #44423C over a #E2E8F0 rule)
    serif font:   packages/experience/index.html (Google Fonts,
                  Instrument+Serif:ital@1 — falls back to Georgia offline)
    logo lockup:  vision-agent-ui new_logo_{icon,text}_light.svg (vector;
                  the logto asset is a 50KB raster of the same lockup)
  Placeholders substituted by oauth.py: __VARIANT__ (success | error),
  __HEADLINE__, __DETAIL__ (pre-escaped text).
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&display=swap">
<style>
  * { box-sizing: border-box; }
  :root { color-scheme: light; }
  html, body { height: 100%; }
  body {
    margin: 0; background: #fff; color: #1e232c;
    font: 14px/1.45 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
  }
  .header { display: flex; align-items: center; gap: 8px; height: 80px; padding: 0 40px; flex-shrink: 0; }
  .header svg { display: block; flex-shrink: 0; }
  .form-area { flex: 1; display: flex; align-items: center; justify-content: center; padding: 32px 20px; }
  /* Centered hero: the status icon crowns centered text — a transient
     confirmation page, so the one signal sits on the visual axis. */
  .form-content { width: 100%; max-width: 454px; text-align: center; }
  .status-icon {
    display: flex; width: 48px; height: 48px; align-items: center;
    justify-content: center; border-radius: 50%;
    margin: 0 auto 20px;
  }
  body.success .status-icon { background: #ecfdf3; color: #039855; }
  body.error .status-icon { background: #fef3f2; color: #d92d20; }
  .status-icon svg { width: 22px; height: 22px; }
  body.success .ic-error, body.error .ic-success { display: none; }
  .title-block { margin-bottom: 16px; }
  .title-gray { display: block; font-size: 28px; line-height: normal; font-weight: 600; color: #1e232c; }
  .title-serif {
    display: block; font-family: "Instrument Serif", Georgia, "Times New Roman", serif;
    font-size: 32px; line-height: 40px; font-style: italic; font-weight: normal; color: #1e232c;
  }
  .subtitle { font-size: 16px; line-height: 24px; color: #525252; }
  .footer {
    flex-shrink: 0; text-align: center; margin: 0 10px; padding: 8px 0 32px;
    border-top: 1px solid #e2e8f0; font-size: 12px; line-height: 16px; color: #44423c;
  }
  .footer a { color: #44423c; font-weight: normal; text-decoration: none; }
  .footer a:hover { text-decoration: underline; }
  .footer .sep { margin: 0 4px; color: #44423c; }
  @media (max-width: 640px) {
    .header { padding: 0 20px; }
    .form-area { padding: 24px 20px; }
  }
</style>
</head>
